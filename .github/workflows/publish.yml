name: Publish

on:
  push:
    branches: [next]
    # Stable releases are armed by an explicit tag push, never by a branch push.
    # Kept broad on purpose — a glob too strict to match a real release tag
    # would fail silently at ship time. Prerelease tags are excluded in the
    # job's `if:` below, where the expression semantics are unambiguous.
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    # Release intent lives out-of-band in the tag — it cannot be spelled
    # accidentally in a commit message, a revert, or a doc that quotes the
    # release convention. See #128.
    #
    # The `-` exclusion keeps the `v1.16.0-next.0` tags that `publish-next`
    # creates via `gh release create` from arming a stable publish. Those tags
    # are made with GITHUB_TOKEN, which does not trigger workflows today — this
    # is the explicit gate rather than a dependency on that behaviour holding.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install

      # Test + lint + build
      - run: bun test
      - run: bun run lint
      - run: bun run build:plugin

      # Verify pack works
      - run: npm pack --dry-run

      # Create GitHub release. The tag already exists — ship.sh created it on
      # the merge commit and pushing it is what triggered this run. Prefer the
      # merged PR's body (the curated release notes drafted by the ship-release
      # skill — see PRs #36, #40, #45 for the template). Fall back to a commit
      # summary only if no PR is associated with the tagged commit.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # The tag is now the input that armed this run, so it is a second
          # source of truth alongside package.json. ship.sh keeps them in step;
          # a hand-pushed tag might not, and a mismatch would create a stray
          # second tag here and then collide in npm publish. Fail loudly first.
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
              echo "::error::Tag ${{ github.ref_name }} does not match package.json version $VERSION"
              exit 1
          fi

          BODY_FILE=$(mktemp)

          # github.sha is the commit the tag points at — the merge commit on
          # main. Its associated PR is the dev → main release PR.
          PR_BODY=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[0].body // empty' 2>/dev/null || true)

          if [ -n "$PR_BODY" ]; then
              printf '%s' "$PR_BODY" > "$BODY_FILE"
          else
              PREV_TAG=$(git tag --sort=-v:refname | grep -v -- '-' | sed -n '2p')
              if [ -n "$PREV_TAG" ]; then
                COMMITS=$(git log --pretty=format:"- %s" "$PREV_TAG..v$VERSION" | grep -v "chore(release)" | grep -v "^- Merge" || true)
              else
                COMMITS=$(git log --pretty=format:"- %s" "v$VERSION" | grep -v "chore(release)" | grep -v "^- Merge" || true)
              fi
              printf '## What'\''s Changed\n\n%s\n\n**Full changelog**: https://github.com/${{ github.repository }}/compare/%s...v%s' \
                  "$COMMITS" "${PREV_TAG:-main}" "$VERSION" > "$BODY_FILE"
          fi

          # Idempotent: re-running this workflow after a failed npm publish must
          # not die here because the release already exists.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
              gh release edit "v$VERSION" \
                  --title "v$VERSION" \
                  --notes-file "$BODY_FILE"
          else
              gh release create "v$VERSION" \
                  --title "v$VERSION" \
                  --notes-file "$BODY_FILE"
          fi
          rm -f "$BODY_FILE"

      # Publish to npm via trusted publishing (OIDC — no token needed)
      - name: Publish to npm
        run: npm publish

      # This used to be a separate `release: published` workflow, but a
      # release created with GITHUB_TOKEN (as above) never raises that
      # event — the workflow existed for several releases and recorded zero
      # runs. Running the notify logic inline, after publish, is what
      # actually fires. See #133.
      - name: Notify shipped issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_URL=$(gh release view "${{ github.ref_name }}" --json url --jq .url)
          scripts/notify-shipped-issues.sh "${{ github.ref_name }}" "$RELEASE_URL"

  publish-next:
    runs-on: ubuntu-latest
    environment: release
    if: github.ref == 'refs/heads/next'
    concurrency:
      group: publish-next
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install

      # Test + lint + build
      - run: bun test
      - run: bun run lint
      - run: bun run build:plugin

      # Compute pre-release version
      - name: Compute next version
        id: version
        run: |
          # Fetch main for comparison
          git fetch origin main

          # Read main's current version
          MAIN_VERSION=$(git show origin/main:package.json | jq -r .version)
          echo "Main version: $MAIN_VERSION"

          # Determine bump level from commits ahead of main
          COMMIT_TEXT=$(git log origin/main..HEAD --pretty=format:"%s%n%b")

          if echo "$COMMIT_TEXT" | grep -q "BREAKING CHANGE"; then
              BUMP_LEVEL="major"
          elif echo "$COMMIT_TEXT" | grep -q "^feat"; then
              BUMP_LEVEL="minor"
          else
              BUMP_LEVEL="patch"
          fi
          echo "Bump level: $BUMP_LEVEL"

          # Apply bump to main's version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$MAIN_VERSION"
          case "$BUMP_LEVEL" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Base version: $BASE_VERSION"

          # Query npm for current @next version
          NPM_NEXT=$(npm view @apijack/core@next version 2>/dev/null || echo "")
          echo "Current npm @next: $NPM_NEXT"

          # Determine counter
          if [ -n "$NPM_NEXT" ]; then
              # Extract base from npm version (e.g., "1.5.0-next.2" -> "1.5.0")
              NPM_BASE=$(echo "$NPM_NEXT" | sed 's/-next\..*//')
              if [ "$NPM_BASE" = "$BASE_VERSION" ]; then
                  # Same base — increment counter
                  NPM_COUNTER=$(echo "$NPM_NEXT" | grep -oE 'next\.[0-9]+' | grep -oE '[0-9]+')
                  COUNTER=$((NPM_COUNTER + 1))
              else
                  # Different base — reset
                  COUNTER=0
              fi
          else
              COUNTER=0
          fi

          NEXT_VERSION="$BASE_VERSION-next.$COUNTER"
          echo "Publishing version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      # Set version (ephemeral — not committed)
      - name: Set version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      # Publish to npm with @next tag
      - name: Publish to npm
        run: npm publish --tag next

      # Create GitHub pre-release
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PREV_TAG=$(git tag --sort=-v:refname | grep -v -- '-' | head -1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" | grep -v "chore(release)" | grep -v "^- Merge" || true)
          else
            COMMITS=$(git log --pretty=format:"- %s" | grep -v "chore(release)" | grep -v "^- Merge" || true)
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --prerelease \
            --notes "$(printf '## What'\''s Changed\n\n%s\n\n**Full changelog**: https://github.com/${{ github.repository }}/compare/%s...v%s' "$COMMITS" "${PREV_TAG:-main}" "$VERSION")"
